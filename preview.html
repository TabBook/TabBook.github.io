<!DOCTYPE html>
<!--
  这是一个「预览文件」，用来在不安装 Jekyll 的情况下直接在浏览器里看博客首页效果。
  双击本文件即可打开。注意：它复用了 assets/css/style.css 和 assets/js/theme.js，
  所以请保持它在项目根目录里。正式网站由 index.html 经 Jekyll 生成，本文件不参与部署。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预览 · 我的博客</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="is-home">

  <header class="site-header" id="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#">我的博客</a>
      <nav class="nav">
        <a href="#posts">首页</a>
        <a href="#">关于</a>
        <a href="#">标签</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式">
          <span class="theme-icon theme-icon--sun">☀</span>
          <span class="theme-icon theme-icon--moon">☾</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <!-- 首屏 Hero -->
    <section class="hero" id="hero">
      <div class="hero-inner">
        <h1 class="hero-title">欢迎</h1>
        <p class="hero-subtitle">记录思考与生活</p>
        <a class="hero-scroll" href="#posts">
          <span>阅读文章</span>
          <span class="hero-arrow">↓</span>
        </a>
      </div>
    </section>

    <!-- 文章列表（示例数据，正式站会自动读取 _posts/）-->
    <section class="posts wrap" id="posts">
      <h2 class="section-title">最新文章</h2>
      <ul class="post-list">
        <li class="post-item">
          <a class="post-item-link" href="#">
            <time class="post-item-date">2026.06.08</time>
            <h3 class="post-item-title">你好，世界</h3>
            <p class="post-item-excerpt">这是这个博客的第一篇文章。如果你看到这段文字，说明博客已经成功跑起来了……</p>
            <span class="post-item-tags"><span class="tag">随笔</span><span class="tag">开始</span></span>
          </a>
        </li>
        <li class="post-item">
          <a class="post-item-link" href="#">
            <time class="post-item-date">2026.05.20</time>
            <h3 class="post-item-title">关于「少即是多」</h3>
            <p class="post-item-excerpt">我一直相信，好的东西往往是「减」出来的，而不是「加」出来的……</p>
            <span class="post-item-tags"><span class="tag">随笔</span><span class="tag">设计</span></span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 你的名字</p>
      <p class="footer-links"><a href="#">邮箱</a><a href="#">RSS</a></p>
    </div>
  </footer>

  <script src="./assets/js/theme.js"></script>
</body>
</html>
