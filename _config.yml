# —— 站点基本信息 ——
title: 我的博客
tagline: 记录思考与生活
description: 一个极简风格的个人博客，用文字记录思考、阅读与生活。
author: TabBook
email: fiqancii@gmail.com

# 部署到 GitHub Pages 时，如果仓库名不是 <用户名>.github.io，
# 需要把 baseurl 改成 "/仓库名"，url 改成 "https://<用户名>.github.io"。
baseurl: ""
url: "https://tabbook.github.io"

# —— 社交链接（留空则不显示）——
social:
  github: "TabBook"
  twitter: ""
  email: "fiqancii@gmail.com"

# —— 构建设置 ——
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
timezone: Asia/Shanghai

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 每页文章数（如启用分页可用）
paginate: 8

# 排除文件，避免被打包进站点
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
